name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project ios/SmartHome.xcodeproj -scheme SmartHome -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartHome.app Payload/
          zip -qry SmartHome-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHome-unsigned-ipa
          path: SmartHome-unsigned.ipa
