name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare private service configuration
        env:
          SERVICE_TOKEN: ${{ secrets.SMART_HOME_API_TOKEN }}
        run: |
          python3 -c 'import os, pathlib, plistlib; token=os.environ.get("SERVICE_TOKEN", ""); assert len(token) >= 32, "SMART_HOME_API_TOKEN is missing"; pathlib.Path("ios/SmartHome/ServiceConfig.plist").write_bytes(plistlib.dumps({"API_TOKEN": token}))'
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          set +e
          xcodebuild -project ios/SmartHome.xcodeproj -scheme SmartHome -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|BUILD FAILED|fatal error:' build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 80 build.log
          fi
          exit "$status"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartHome.app Payload/
          zip -qry SmartHome-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHome-unsigned-ipa
          path: SmartHome-unsigned.ipa
