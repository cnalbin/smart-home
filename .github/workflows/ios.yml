name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          set +e
          xcodebuild -project ios/SmartHome.xcodeproj -scheme SmartHome -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|BUILD FAILED|fatal error:' build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 80 build.log
          fi
          exit "$status"
      - name: Test password storage and capture login screen
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"] and d.get("isAvailable")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          set +e
          xcodebuild test -project ios/SmartHome.xcodeproj -scheme SmartHome -destination "platform=iOS Simulator,id=$device" -derivedDataPath sim-build -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES > test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 100 test.log
            exit "$status"
          fi
          xcrun simctl status_bar "$device" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$device" sim-build/Build/Products/Debug-iphonesimulator/SmartHome.app
          xcrun simctl launch "$device" com.example.smarthome
          sleep 3
          xcrun simctl io "$device" screenshot login-preview.png
      - name: Upload login preview
        uses: actions/upload-artifact@v4
        with:
          name: login-preview
          path: login-preview.png
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: |
            build.log
            test.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartHome.app Payload/
          zip -qry SmartHome-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHome-unsigned-ipa
          path: SmartHome-unsigned.ipa
          retention-days: 7
